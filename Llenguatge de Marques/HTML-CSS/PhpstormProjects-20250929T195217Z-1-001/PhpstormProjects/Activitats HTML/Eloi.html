<body>

<header>
    <h1>Comprar Tickets</h1>
    <p>Descripcio pagina</p>
    <hr>
</header>
<form>
    <label>Nom del restaurant: </label><input type="text" id="Nom" required>
    <br>
    <label>Genero: </label>
    <input list="generos" id="genero" name="generos">
    <datalist id="generos">
        <option value="Italiano">
        <option value="Marisco">
        <option value="Mexicana">
    </datalist>
    <br>
    <label>Valoracion: </label>
    <input list="valoracion" id="valoracio" name="valoracion">
    <datalist id="valoracion">
        <option value="0">
        <option value="1">
        <option value="2">
        <option value="3">
        <option value="4">
        <option value="5">
    </datalist>
    <br>
    <label>Ubicacion: </label><input type="text">
</form>
<hr>
