<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="text-center mb-3">
                <img src="https://us.123rf.com/450wm/koblizeek/koblizeek2001/koblizeek200100050/138262629-man-icon-profile-member-user-perconal-symbol-vector-on-white-isolated-background.jpg"
                     alt="Avatar">
            </div>
            <form action="#" method="post">
                <div class="container">
                    <div class="mb-3">
                        <label for="Usuari"><b>Usuari</b></label>
                        <input type="text" placeholder="Usuari" name="Usuari" required>
                    </div>
                    <div class="mb-3">
                        <label for="Password"><b>Password</b></label>
                        <input type="Password" placeholder="Password" name="Password" required>
                    </div>
                    <div class="mb-3">
                        <button type="submit">Login</button>
                    </div>
                    <div class="mb-3">
                        <label>
                            <input type="checkbox" checked="checked" name="remember"> Remember me
                        </label>
                    </div>
                </div>
                <div class="form-actions d-flex justify-content-between align-items-center">
                    <button type="button" class="btn btn-danger">Cancel</button>
                    <span class="Olvidar Contraseña">Forgot <a href="#">password?</a></span>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
